# Stack für den Raspberry Pi (Board). In Portainer: Umgebung "Pi" → Stacks → Add stack.
# Variablen: siehe .env.example

services:
  board:
    image: ghcr.io/prinz-autistimus/autoweed-board:${AUTOWEED_TAG:-latest}
    container_name: autoweed-board
    restart: always
    ports:
      - "8080:8080"
    devices:
      - /dev/gpiomem:/dev/gpiomem             # Relais und Pumpe
      - /dev/i2c-1:/dev/i2c-1                 # Sensoren; erst nach "I²C aktivieren" vorhanden, siehe README.md
    environment:
      - BOARD_TOKEN=${BOARD_TOKEN:?BOARD_TOKEN fehlt}
      - CLIMATE_SENSOR=${CLIMATE_SENSOR:-sht40}     # sht31 oder sht40
      - HEATER_PIN=${HEATER_PIN:-5}                 # BCM-Nummern (Pins 29/31/33)
      - LIGHT_PIN=${LIGHT_PIN:-6}
      - PUMP_PIN=${PUMP_PIN:-13}
      - RELAY_ACTIVE_LOW=${RELAY_ACTIVE_LOW:-true}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      - board-data:/data                      # lokale Kopie der Konfiguration, Pumpenzähler
      # systemd-timesyncd legt hier "synchronized" an, sobald die Uhr stimmt
      - /run/systemd/timesync:/run/systemd/timesync:ro
    stop_grace_period: 10s                    # Zeit zum Abschalten der Pumpe bei SIGTERM
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: nickfedor/watchtower:latest        # gepflegter Fork, containrrr/watchtower ist archiviert
    container_name: autoweed-watchtower
    restart: unless-stopped
    command: --label-enable --cleanup --interval ${WATCHTOWER_INTERVAL:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  board-data:
