name: Build

# main  → Docker-Tag "edge", Verdrahtungspläne als Artefakt
# v1.2.3 → Docker-Tags "1.2.3", "1.2", "latest" + GitHub-Release mit Verdrahtungsplänen
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    strategy:
      matrix:
        include:
          - image: board
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - image: ecs
            runner: ubuntu-latest
            platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/prinz-autistimus/autoweed-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz librsvg2-bin
      - run: pipx install wireviz
      - name: Verdrahtungspläne rendern
        run: |
          mkdir -p wiring-out
          for plan in hardware/wiring/*.yml; do
            wireviz -o wiring-out "$plan"
          done
      - name: Übersicht rendern (und prüfen, ob overview.svg im Repo aktuell ist)
        run: |
          python3 hardware/wiring/overview.py wiring-out/overview.svg
          diff -q wiring-out/overview.svg hardware/wiring/overview.svg \
            || { echo "::error::hardware/wiring/overview.svg ist veraltet: python3 hardware/wiring/overview.py hardware/wiring/overview.svg"; exit 1; }
          rsvg-convert -w 2840 -o wiring-out/overview.png wiring-out/overview.svg
          ls -l wiring-out
      - uses: actions/upload-artifact@v7
        with:
          name: verdrahtung
          path: wiring-out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, wiring]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: verdrahtung
          path: wiring-out
      - name: GitHub-Release mit Verdrahtungsplänen
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag \
            wiring-out/*.svg wiring-out/*.png wiring-out/*.html wiring-out/*.tsv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
